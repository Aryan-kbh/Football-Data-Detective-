[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-data-detective"
version = "6.1.0"
description = "Auditable football event and synchronized tracking data QA"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Portfolio project"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "plotly>=5.20,<7",
  "requests>=2.31,<3", "streamlit>=1.35,<2"
]

[tool.setuptools.packages.find]
include = ["fdd*"]
